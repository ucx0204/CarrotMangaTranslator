name: Manual redaction checks

# One ordinary repository check; no browser captures or duplicated test/build runs.
on:
  push:
    branches: [feat/manual-redaction-workspace-20260910]
    paths:
      - .github/workflows/manual-redaction-ux-check.yml
      - src/**
      - tests/**
      - scripts/**
      - "*.json"
      - "*.cjs"
      - "*.ts"

permissions:
  contents: read

concurrency:
  group: manual-redaction-check-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONIOENCODING: utf-8
  PYTHONUTF8: "1"

jobs:
  windows:
    if: github.repository == 'ucx0204/CarrotMangaTranslator'
    runs-on: windows-latest
    timeout-minutes: 55
    steps:
      - name: Check out the feature checkpoint
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
          show-progress: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: npm ci
      - name: Run the complete repository check once
        run: npm run check
      - name: Preserve check diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: manual-redaction-check-${{ github.run_id }}
          path: |
            .tmp/check-timings.json
            .tmp/check-logs/
            .tmp/check-results/
          if-no-files-found: warn
          retention-days: 7
