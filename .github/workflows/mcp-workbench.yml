name: MCP isolated workbench

on:
  push:
    branches: [feat/mcp-app-bridge]
    paths: [.github/workflows/mcp-workbench.yml]

permissions:
  contents: read

jobs:
  snapshot:
    if: github.repository == 'ucx0204/CarrotMangaTranslator' && github.ref == 'refs/heads/feat/mcp-app-bridge'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - name: Prepare tracked source and test-only dependency snapshots
        shell: bash
        run: |
          npm ci --ignore-scripts
          git archive --format=tar.gz HEAD -o "$RUNNER_TEMP/carrot-source.tar.gz"
          tar -czf "$RUNNER_TEMP/carrot-node-modules.tar.gz" node_modules
          git rev-parse HEAD > "$RUNNER_TEMP/carrot-source-commit.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mcp-isolated-workbench
          path: |
            ${{ runner.temp }}/carrot-source.tar.gz
            ${{ runner.temp }}/carrot-node-modules.tar.gz
            ${{ runner.temp }}/carrot-source-commit.txt
          retention-days: 1
          compression-level: 0
