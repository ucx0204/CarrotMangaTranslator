name: macOS Release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Existing stable release tag to receive macOS artifacts (example: v1.6.4)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: mac-release-${{ inputs.tag_name }}
  cancel-in-progress: false

jobs:
  build_verify:
    runs-on: macos-15
    timeout-minutes: 360
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.release_meta.outputs.tag }}
      version: ${{ steps.release_meta.outputs.version }}
    env:
      MGT_MAC_CLEAN_CARGO_TARGET: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Confirm Apple Silicon runner
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "arm64"
          sw_vers
          sysctl -n hw.memsize

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve and verify stable release metadata
        id: release_meta
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG_NAME: ${{ inputs.tag_name }}
        run: |
          set -euo pipefail
          expected_ref="refs/heads/${{ github.event.repository.default_branch }}"
          if [[ "$GITHUB_REF" != "$expected_ref" ]]; then
            echo "macOS stable release must run from $expected_ref, not $GITHUB_REF." >&2
            exit 1
          fi
          version="$(node -p "require('./package.json').version")"
          expected_tag="v${version}"
          if [[ "$INPUT_TAG_NAME" != "$expected_tag" ]]; then
            echo "Release tag '$INPUT_TAG_NAME' does not match package version '$version' (expected '$expected_tag')." >&2
            exit 1
          fi
          tag_commit="$(git rev-list -n 1 "$INPUT_TAG_NAME")"
          if [[ -z "$tag_commit" || "$tag_commit" != "$GITHUB_SHA" ]]; then
            echo "Release tag '$INPUT_TAG_NAME' must exist and point to $GITHUB_SHA; got '${tag_commit:-missing}'." >&2
            exit 1
          fi
          if [[ "$(gh release view "$INPUT_TAG_NAME" --json isDraft --jq '.isDraft')" != "false" ]]; then
            echo "Release '$INPUT_TAG_NAME' must already be published, not a draft." >&2
            exit 1
          fi
          if [[ "$(gh release view "$INPUT_TAG_NAME" --json isPrerelease --jq '.isPrerelease')" != "false" ]]; then
            echo "Release '$INPUT_TAG_NAME' is a pre-release, not the stable release." >&2
            exit 1
          fi
          windows_asset="CarrotMangaTranslator-Setup-${INPUT_TAG_NAME}.exe"
          if ! gh release view "$INPUT_TAG_NAME" --json assets --jq '.assets[].name' | grep -Fxq "$windows_asset"; then
            echo "Release '$INPUT_TAG_NAME' does not contain the verified Windows installer '$windows_asset'." >&2
            exit 1
          fi
          echo "tag=$INPUT_TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Run full cross-platform checks
        run: npm run check

      - name: Capture production renderer at release QA sizes
        run: |
          npm run qa:ui -- --entry index.html --build-channel stable --width 1440 --height 900 --output "${RUNNER_TEMP}/mac-release-ui-1440x900.png"
          npm run qa:ui -- --entry index.html --build-channel stable --width 1240 --height 760 --output "${RUNNER_TEMP}/mac-release-ui-1240x760.png"

      - name: Verify pinned model metadata
        run: npm run verify:hf-assets

      - name: Prepare unsigned macOS build inputs
        env:
          MGT_RELEASE_CHANNEL: stable
          MANGA_TRANSLATOR_BUILD_CHANNEL: stable
          MGT_TARGET_PLATFORM: darwin
          MGT_MAC_RUNTIME_ROOT: ${{ github.workspace }}/.tmp/mac-runtime
        run: |
          node scripts/prepare-mac-icon.cjs
          npm run build:mac:runners
          npm run prepare:mac:runtime
          npm run build

      - name: Select signing mode
        shell: bash
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY_P8_B64: ${{ secrets.APPLE_API_KEY_P8_B64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          values=("$CSC_LINK" "$CSC_KEY_PASSWORD" "$APPLE_API_KEY_P8_B64" "$APPLE_API_KEY_ID" "$APPLE_API_ISSUER")
          present=0
          for value in "${values[@]}"; do
            if [[ -n "$value" ]]; then present=$((present + 1)); fi
          done
          if [[ "$present" -eq 0 ]]; then
            echo "MGT_MAC_SIGNING_MODE=adhoc" >> "$GITHUB_ENV"
            echo "SIGNING_LABEL=Unsigned (ad-hoc)" >> "$GITHUB_ENV"
          elif [[ "$present" -ne 5 ]]; then
            echo "Developer ID signing secrets are only partially configured." >&2
            exit 1
          else
            key_path="$RUNNER_TEMP/AuthKey.p8"
            printf '%s' "$APPLE_API_KEY_P8_B64" | /usr/bin/base64 -D > "$key_path"
            chmod 600 "$key_path"
            echo "MGT_MAC_SIGNING_MODE=developer-id" >> "$GITHUB_ENV"
            echo "SIGNING_LABEL=Developer ID + notarized" >> "$GITHUB_ENV"
          fi

      - name: Build and strictly verify stable arm64 DMG and ZIP
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ runner.temp }}/AuthKey.p8
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          MGT_MAC_BUILD_INPUTS_PREPARED: "1"
        run: npm run dist:mac

      - name: Remove notarization key
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"

      - name: Confirm stable release artifacts
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.release_meta.outputs.version }}"
          test -s "dist/CarrotMangaTranslator-${version}-macOS-arm64.dmg"
          test -s "dist/CarrotMangaTranslator-${version}-macOS-arm64.zip"
          test -s dist/SHA256SUMS-macOS-arm64.txt
          test ! -e dist/mac-alpha-hosted-app-smoke-waiver.json
          (cd dist && shasum -a 256 -c SHA256SUMS-macOS-arm64.txt)

      - name: Generate macOS provenance
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.release_meta.outputs.version }}"
          dmg_sha="$(shasum -a 256 "dist/CarrotMangaTranslator-${version}-macOS-arm64.dmg" | awk '{print $1}')"
          zip_sha="$(shasum -a 256 "dist/CarrotMangaTranslator-${version}-macOS-arm64.zip" | awk '{print $1}')"
          node -e 'const fs=require("fs"); fs.writeFileSync("dist/macOS-arm64-provenance.json", JSON.stringify({schemaVersion:1,repository:process.env.GITHUB_REPOSITORY,commit:process.env.GITHUB_SHA,ref:process.env.GITHUB_REF,runId:process.env.GITHUB_RUN_ID,runAttempt:process.env.GITHUB_RUN_ATTEMPT,artifacts:{dmg:process.argv[1],zip:process.argv[2]}},null,2)+"\n")' "$dmg_sha" "$zip_sha"

      - name: Upload verified macOS build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.release_meta.outputs.tag }}-macOS-arm64
          if-no-files-found: error
          retention-days: 30
          path: |
            dist/CarrotMangaTranslator-${{ steps.release_meta.outputs.version }}-macOS-arm64.dmg
            dist/CarrotMangaTranslator-${{ steps.release_meta.outputs.version }}-macOS-arm64.zip
            dist/SHA256SUMS-macOS-arm64.txt
            dist/macOS-arm64-provenance.json
            ${{ runner.temp }}/mac-release-ui-1440x900.png
            ${{ runner.temp }}/mac-release-ui-1240x760.png

      - name: Summarize verified macOS release
        shell: bash
        run: |
          {
            echo "### Verified macOS assets uploaded to ${{ steps.release_meta.outputs.tag }}"
            echo "- Runner: $(uname -m), $(sw_vers -productVersion)"
            echo "- Signing: $SIGNING_LABEL"
            echo "- Packaged GUI lifecycle: passed without an Alpha waiver"
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    needs: build_verify
    if: ${{ needs.build_verify.result == 'success' }}
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - name: Download verified macOS artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ needs.build_verify.outputs.tag }}-macOS-arm64
          path: release-artifact

      - name: Verify and publish macOS assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.build_verify.outputs.tag }}
          VERSION: ${{ needs.build_verify.outputs.version }}
        run: |
          set -euo pipefail
          mapfile -t checksum_paths < <(find release-artifact -type f -name SHA256SUMS-macOS-arm64.txt -print)
          if [[ "${#checksum_paths[@]}" -ne 1 ]]; then
            echo "Expected exactly one macOS checksum manifest, found ${#checksum_paths[@]}." >&2
            exit 1
          fi
          artifact_dir="$(dirname "${checksum_paths[0]}")"
          dmg_path="$artifact_dir/CarrotMangaTranslator-${VERSION}-macOS-arm64.dmg"
          zip_path="$artifact_dir/CarrotMangaTranslator-${VERSION}-macOS-arm64.zip"
          provenance_path="$artifact_dir/macOS-arm64-provenance.json"
          test -s "$dmg_path"
          test -s "$zip_path"
          test -s "$provenance_path"
          (cd "$artifact_dir" && shasum -a 256 -c SHA256SUMS-macOS-arm64.txt)
          gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            "$dmg_path" \
            "$zip_path" \
            "${checksum_paths[0]}" \
            "$provenance_path" \
            --clobber
