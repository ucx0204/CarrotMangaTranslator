name: CI repair source delta

on:
  push:
    branches: [fix/redaction-review-and-sfx-93-20260911]
    paths: [.github/workflows/ci-repair-source.yml]

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Preserve exact repair delta
        run: |
          mkdir -p "$RUNNER_TEMP/ci-source"
          git bundle create "$RUNNER_TEMP/ci-source/delta.bundle" HEAD ^fec7d193b19c93f00d50534fd1044cd808672d2c
          git rev-parse HEAD > "$RUNNER_TEMP/ci-source/commit.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: ci-repair-source-${{ github.sha }}
          path: ${{ runner.temp }}/ci-source/
          retention-days: 3
          if-no-files-found: error
