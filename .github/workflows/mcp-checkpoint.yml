name: MCP checkpoint

on:
  push:
    branches:
      - feat/mcp-app-bridge

permissions:
  contents: read

concurrency:
  group: mcp-checkpoint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checkpoint:
    if: github.repository == 'ucx0204/CarrotMangaTranslator' && github.ref == 'refs/heads/feat/mcp-app-bridge'
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    permissions:
      contents: write
    steps:
      - name: Check out exact checkpoint
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm

      - name: Install repository dependencies
        run: npm ci

      - name: Format only MCP checkpoint files
        run: >-
          node node_modules/prettier/bin/prettier.cjs --write
          .github/workflows/mcp-checkpoint.yml
          'docs/mcp-*.md'
          'src/main/application/mcp*.ts'
          'src/main/mcp/*.ts'
          src/main/mcpRuntime.ts
          src/main/index.ts
          'tests/mcp*.test.ts'
          'scripts/mcp-*.cjs'
          'scripts/mcp-*.mjs'
          scripts/architecture-budget-baseline.json

      - name: Save formatting checkpoint on this branch only
        run: |
          git add -- .github/workflows/mcp-checkpoint.yml docs/mcp-*.md src/main/application/mcp*.ts src/main/mcp src/main/mcpRuntime.ts src/main/index.ts tests/mcp*.test.ts scripts/mcp-*.cjs scripts/mcp-*.mjs scripts/architecture-budget-baseline.json
          if ! git diff --cached --quiet; then
            current=$(git ls-remote origin refs/heads/feat/mcp-app-bridge | cut -f1)
            test "$current" = "$GITHUB_SHA"
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'style(mcp): format implementation checkpoint with repository Prettier'
            git push origin HEAD:refs/heads/feat/mcp-app-bridge
          fi
          git rev-parse HEAD

      - name: Focused MCP behavior tests and CLI entrypoints
        run: |
          node scripts/mcp-dev.cjs --help
          node scripts/mcp-smoke.mjs --help
          node scripts/mcp-web.cjs --help
          node scripts/mcp-web-smoke.mjs --help
          node node_modules/vitest/vitest.mjs run tests/mcp

      - name: Build the existing application
        run: npm run build

      - name: Real Electron MCP runtime and redaction smoke
        run: node node_modules/electron/cli.js scripts/mcp-electron-smoke.cjs

      - name: Static checks with complete repository dependencies
        if: always()
        run: |
          failed=0
          for gate in typecheck typecheck:electron typecheck:js format:check arch:deps arch:budget lint:error-handling lint deadcode:exports check:script-entrypoints check:maintainability check:duplicates; do
            echo "::group::$gate"
            if ! npm run "$gate"; then failed=1; fi
            echo '::endgroup::'
          done
          exit "$failed"

      - name: Verify pinned Cloudflare binary for the synthetic HTTPS test
        shell: pwsh
        run: |
          $binary = Join-Path $env:RUNNER_TEMP 'carrot-cloudflared-2026.9.1.exe'
          Invoke-WebRequest 'https://github.com/cloudflare/cloudflared/releases/download/2026.9.1/cloudflared-windows-amd64.exe' -OutFile $binary
          if ((Get-Item $binary).Length -ne 54976432) { throw 'Unexpected cloudflared asset size' }
          $expected = '2837888cc0f5d58f15b6dc478376de90b4d3ba5241c7947455d1e0a0df429712'
          if ((Get-FileHash $binary -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) { throw 'cloudflared checksum mismatch' }
          "CARROT_CLOUDFLARED_PATH=$binary" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          & $binary --version

      - name: Live Cloudflare OAuth with an isolated synthetic library
        timeout-minutes: 6
        env:
          CARROT_MCP_SMOKE_TUNNEL: "1"
        run: node node_modules/electron/cli.js scripts/mcp-electron-smoke.cjs
