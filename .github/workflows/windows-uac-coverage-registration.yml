name: Windows UAC Coverage Registration

on:
  push:
    branches:
      - fix/windows-protected-folder-uac
    paths:
      - .github/workflows/windows-uac-coverage-registration.yml

permissions:
  contents: read

jobs:
  register:
    if: github.repository == 'ucx0204/CarrotMangaTranslator' && github.ref == 'refs/heads/fix/windows-protected-folder-uac'
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Measure only the three introduced modules
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .tmp | Out-Null
          @'
          import { defineConfig } from "vitest/config";
          export default defineConfig({ test: {
            include: ["tests/startupWriteAccess.test.ts", "tests/windowsStartup.test.ts", "tests/windowsElevation.test.ts", "tests/windowsElevation.native.test.ts"],
            testTimeout: 15000,
            maxWorkers: 2,
            coverage: {
              enabled: true,
              provider: "v8",
              reporter: ["text-summary", "json-summary"],
              reportsDirectory: ".tmp/windows-uac-coverage",
              include: ["src/main/startupWriteAccess.ts", "src/main/windowsElevation.ts", "src/main/windowsStartup.ts"],
              thresholds: { lines: 85, statements: 85, functions: 85, branches: 75 }
            }
          } });
          '@ | Set-Content -Encoding utf8 .tmp/windows-uac-coverage.config.mts
          npx vitest run --config .tmp/windows-uac-coverage.config.mts
          exit $LASTEXITCODE
      - name: Register measured floors without changing existing baselines
        shell: pwsh
        run: |
          @'
          const assert = require("node:assert/strict");
          const fs = require("node:fs");
          const path = require("node:path");
          const crypto = require("node:crypto");
          const reportPath = ".tmp/windows-uac-coverage/coverage-summary.json";
          const bytes = fs.readFileSync(reportPath);
          const report = JSON.parse(bytes);
          const files = ["src/main/startupWriteAccess.ts", "src/main/windowsElevation.ts", "src/main/windowsStartup.ts"];
          const metrics = ["lines", "statements", "functions", "branches"];
          const records = new Map(Object.entries(report).filter(([name]) => name !== "total").map(([name, value]) => [path.relative(process.cwd(), name).replaceAll("\\", "/"), value]));
          assert.deepEqual([...records.keys()].sort(), [...files].sort());
          const manifestPath = "scripts/production-cleanup-coverage-floors.json";
          const manifest = JSON.parse(fs.readFileSync(manifestPath, "utf8"));
          const original = structuredClone(manifest);
          for (const file of files) {
            assert.equal(Object.hasOwn(manifest.floors, file), false);
            assert.equal(Object.hasOwn(manifest.introducedFloors, file), false);
            const record = records.get(file);
            const floor = {};
            for (const metric of metrics) {
              const { covered, total, pct } = record[metric];
              assert.ok(total > 0 && covered > 0 && covered <= total);
              assert.ok(pct >= (metric === "branches" ? 70 : 80), `${file} ${metric}: ${pct}`);
              floor[metric] = { covered, total, pct };
            }
            manifest.introducedFloors[file] = floor;
          }
          manifest.introducedFloors = Object.fromEntries(Object.entries(manifest.introducedFloors).sort(([a], [b]) => a < b ? -1 : a > b ? 1 : 0));
          assert.deepEqual(manifest.floors, original.floors);
          assert.deepEqual(manifest.provenance, original.provenance);
          assert.deepEqual(manifest.deletedFiles, original.deletedFiles);
          for (const [file, floor] of Object.entries(original.introducedFloors)) assert.deepEqual(manifest.introducedFloors[file], floor);
          fs.writeFileSync(manifestPath, JSON.stringify(manifest, null, 2) + "\n");
          const testPath = "tests/productionCleanupCoverageGate.test.ts";
          const test = fs.readFileSync(testPath, "utf8");
          const expected = "expect(scope.added).toHaveLength(618);";
          assert.equal(test.split(expected).length, 2);
          fs.writeFileSync(testPath, test.replace(expected, "expect(scope.added).toHaveLength(621);"));
          fs.writeFileSync(".tmp/windows-uac-registration.json", JSON.stringify({ source: process.env.GITHUB_SHA, reportSha256: crypto.createHash("sha256").update(bytes).digest("hex"), floors: Object.fromEntries(files.map(file => [file, manifest.introducedFloors[file]])) }, null, 2));
          '@ | node
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npx prettier --write scripts/production-cleanup-coverage-floors.json tests/productionCleanupCoverageGate.test.ts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --stat
      - name: Commit each registration file independently to the working branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $branch = 'fix/windows-protected-folder-uac'
          $repo = 'ucx0204/CarrotMangaTranslator'
          $expectedHead = '${{ github.sha }}'
          $files = @('scripts/production-cleanup-coverage-floors.json', 'tests/productionCleanupCoverageGate.test.ts')
          foreach ($file in $files) {
            $head = gh api "repos/$repo/git/ref/heads/$branch" --jq '.object.sha'
            if ($LASTEXITCODE -ne 0 -or $head -ne $expectedHead) { throw 'Working branch moved; refusing to overwrite concurrent changes.' }
            $blob = git rev-parse "HEAD:$file"
            if ($LASTEXITCODE -ne 0) { throw 'Missing source blob.' }
            $payload = @{
              branch = $branch
              sha = $blob
              message = "test(windows): register measured startup coverage in $file [skip ci]"
              content = [Convert]::ToBase64String([IO.File]::ReadAllBytes((Join-Path $PWD $file)))
            } | ConvertTo-Json
            $payload | Set-Content -Encoding utf8 .tmp/coverage-commit.json
            $commit = gh api --method PUT "repos/$repo/contents/$file" --input .tmp/coverage-commit.json --jq '.commit.sha'
            if ($LASTEXITCODE -ne 0) { throw "Could not commit $file" }
            $expectedHead = $commit
            Write-Output "Committed $file at $commit"
          }
      - name: Preserve measured coverage and provenance
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-uac-coverage-registration-${{ github.sha }}
          path: |
            .tmp/windows-uac-coverage/
            .tmp/windows-uac-registration.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
