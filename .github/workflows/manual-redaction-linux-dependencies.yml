name: Manual redaction Linux test dependencies

# Read-only development support. Does not modify application sources, branches,
# tags or releases. The artifact contains public lockfile dependencies only.
on:
  push:
    branches: [feat/manual-redaction-workspace-20260910]
    paths: [.github/workflows/manual-redaction-linux-dependencies.yml]

permissions:
  contents: read

jobs:
  dependencies:
    if: github.repository == 'ucx0204/CarrotMangaTranslator'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the feature lockfile
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          show-progress: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - name: Install exact dependencies without package lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Package public test dependencies without fonts or credentials
        shell: python
        run: |
          import hashlib
          import json
          import os
          import subprocess
          import zipfile
          from pathlib import Path

          root = Path.cwd()
          destination = root / '.tmp' / 'redaction-linux-dependencies'
          destination.mkdir(parents=True, exist_ok=True)
          suffixes = {'.js', '.cjs', '.mjs', '.ts', '.mts', '.cts', '.json', '.css', '.html', '.node', '.wasm', '.map'}
          count = 0
          archive = destination / 'node-modules-linux.zip'
          with zipfile.ZipFile(archive, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=4) as output:
              for path in sorted((root / 'node_modules').rglob('*')):
                  if path.is_symlink() or not path.is_file():
                      continue
                  relative = path.relative_to(root)
                  if any(part in {'.git', '.cache', '.npm', '.bin'} for part in relative.parts):
                      continue
                  if path.suffix not in suffixes and not (path.suffix == '' and 'bin' in relative.parts):
                      continue
                  output.write(path, relative.as_posix())
                  count += 1
          metadata = {
              'source': os.environ['GITHUB_SHA'],
              'runId': os.environ['GITHUB_RUN_ID'],
              'node': subprocess.check_output(['node', '--version'], text=True).strip(),
              'lockfileSha256': hashlib.sha256((root / 'package-lock.json').read_bytes()).hexdigest(),
              'archiveSha256': hashlib.sha256(archive.read_bytes()).hexdigest(),
              'files': count,
              'scope': 'Public npm test dependencies only; no application code or user data',
          }
          (destination / 'manifest.json').write_text(json.dumps(metadata, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(metadata, indent=2))
      - name: Preserve offline validation dependencies
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: manual-redaction-linux-dependencies-${{ github.run_id }}
          path: .tmp/redaction-linux-dependencies/
          retention-days: 2
          if-no-files-found: error
          compression-level: 0
