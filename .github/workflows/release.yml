name: Release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag to create or update (example: v0.1.0)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.release_meta.outputs.tag }}
      target: ${{ steps.release_meta.outputs.target }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run checks
        run: npm run check

      - name: Resolve and verify release metadata
        id: release_meta
        shell: pwsh
        run: |
          $expectedRef = "refs/heads/${{ github.event.repository.default_branch }}"
          if ("${{ github.ref }}" -ne $expectedRef) {
            throw "Release workflow must run from '$expectedRef', not '${{ github.ref }}'."
          }

          $tag = "${{ inputs.tag_name }}"
          $version = node -p "require('./package.json').version"
          $expectedTag = "v$version"
          if ($tag -ne $expectedTag) {
            throw "Release tag '$tag' does not match package version '$version' (expected '$expectedTag')."
          }

          $notesPath = "docs/release-notes/$tag.md"
          if (-not (Test-Path -LiteralPath $notesPath -PathType Leaf)) {
            throw "Release notes are missing: $notesPath"
          }

          $existingTags = @(git tag --list $tag)
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to inspect existing tag '$tag'."
          }
          if ($existingTags -contains $tag) {
            $tagCommit = (git rev-list -n 1 $tag).Trim()
            if ($tagCommit -ne "${{ github.sha }}") {
              throw "Existing tag '$tag' points to $tagCommit, not ${{ github.sha }}."
            }
          }

          "tag=$tag" >> $env:GITHUB_OUTPUT
          "target=${{ github.sha }}" >> $env:GITHUB_OUTPUT
          "notes_path=$notesPath" >> $env:GITHUB_OUTPUT

      - name: Verify built-in Hugging Face assets
        run: npm run verify:hf-assets

      - name: Build Windows release
        env:
          MGT_THIN_INSTALLER: "1"
          MGT_ALLOW_MISSING_FLUX_RUNNER: "1"
        run: npm run dist:win

      - name: Smoke test fresh install and upgrade
        run: node scripts/smoke-windows-installer.cjs

      - name: Seal Windows release artifact
        shell: pwsh
        env:
          RELEASE_TAG: ${{ steps.release_meta.outputs.tag }}
          RELEASE_NOTES_PATH: ${{ steps.release_meta.outputs.notes_path }}
        run: |
          $files = @(Get-ChildItem -Path "dist" -Filter "* Setup *.exe")
          if ($files.Count -ne 1) {
            throw "Expected exactly one Windows installer, found $($files.Count)."
          }
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $files[0].FullName).Hash.ToLowerInvariant()
          $publishedArtifact = "CarrotMangaTranslator-Setup-$env:RELEASE_TAG.exe"
          "$hash  $publishedArtifact" | Set-Content -Encoding ascii dist/SHA256SUMS-windows.txt
          Copy-Item -LiteralPath $env:RELEASE_NOTES_PATH -Destination dist/release-notes.md
          @{
            schemaVersion = 1
            repository = "${{ github.repository }}"
            commit = "${{ github.sha }}"
            ref = "${{ github.ref }}"
            runId = "${{ github.run_id }}"
            runAttempt = "${{ github.run_attempt }}"
            artifact = $files[0].Name
            publishedArtifact = $publishedArtifact
            sha256 = $hash
          } | ConvertTo-Json | Set-Content -Encoding utf8 dist/windows-provenance.json

      - name: Upload sealed Windows artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-release-${{ steps.release_meta.outputs.tag }}
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/* Setup *.exe
            dist/SHA256SUMS-windows.txt
            dist/windows-provenance.json
            dist/release-notes.md

  publish:
    needs: build
    if: ${{ needs.build.result == 'success' }}
    runs-on: windows-latest
    environment: release
    permissions:
      contents: write
    steps:
      - name: Download sealed Windows artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: windows-release-${{ needs.build.outputs.tag }}
          path: release-artifact

      - name: Verify sealed Windows artifact
        shell: pwsh
        env:
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          RELEASE_TARGET: ${{ needs.build.outputs.target }}
        run: |
          $files = @(Get-ChildItem -Path "release-artifact" -Filter "* Setup *.exe")
          if ($files.Count -ne 1) {
            throw "Expected exactly one sealed Windows installer, found $($files.Count)."
          }
          $line = (Get-Content -LiteralPath release-artifact/SHA256SUMS-windows.txt -Encoding ascii -Raw).Trim()
          if ($line -notmatch '^([a-f0-9]{64})  (.+\.exe)$') { throw "Invalid Windows checksum manifest." }
          $expected = $Matches[1]
          $fileName = $Matches[2]
          $publishedArtifact = "CarrotMangaTranslator-Setup-$env:RELEASE_TAG.exe"
          if ($fileName -ne $publishedArtifact) { throw "Windows checksum manifest names an unexpected release asset." }
          $provenance = Get-Content -LiteralPath release-artifact/windows-provenance.json -Encoding utf8 -Raw | ConvertFrom-Json
          if ($provenance.artifact -ne $files[0].Name) { throw "Windows provenance names an unexpected sealed installer." }
          if ($provenance.publishedArtifact -ne $publishedArtifact) { throw "Windows provenance names an unexpected published asset." }
          if ($provenance.sha256 -ne $expected) { throw "Windows provenance checksum does not match the checksum manifest." }
          if ($provenance.commit -ne $env:RELEASE_TARGET) { throw "Windows provenance commit does not match the release target." }
          $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $files[0].FullName).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "Windows release artifact checksum mismatch." }

      - name: Publish GitHub release assets
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          RELEASE_TARGET: ${{ needs.build.outputs.target }}
          RELEASE_NOTES_PATH: release-artifact/release-notes.md
        run: |
          $headers = @{
            Authorization = "Bearer $env:GITHUB_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          function Get-GitHubApiStatusCode {
            param([Parameter(Mandatory = $true)] $ErrorRecord)

            if ($null -eq $ErrorRecord.Exception.Response) {
              return 0
            }
            try {
              return [int]$ErrorRecord.Exception.Response.StatusCode
            } catch {
              return 0
            }
          }
          function Invoke-GitHubApiWithRetry {
            param(
              [Parameter(Mandatory = $true)] [string] $Uri,
              [string] $Method = "Get",
              [Parameter(Mandatory = $true)] [hashtable] $Headers,
              [string] $Body,
              [string] $ContentType,
              [string] $InFile,
              [int] $TimeoutSec = 100,
              [string] $RecoveryUri
            )

            $maximumAttempts = 6
            $retryableStatusCodes = @(0, 408, 429, 500, 502, 503, 504)
            for ($attempt = 1; $attempt -le $maximumAttempts; $attempt++) {
              $request = @{
                Uri = $Uri
                Method = $Method
                Headers = $Headers
                TimeoutSec = $TimeoutSec
                ErrorAction = "Stop"
              }
              if ($PSBoundParameters.ContainsKey("Body")) { $request.Body = $Body }
              if ($PSBoundParameters.ContainsKey("ContentType")) { $request.ContentType = $ContentType }
              if ($PSBoundParameters.ContainsKey("InFile")) { $request.InFile = $InFile }

              try {
                return Invoke-RestMethod @request
              } catch {
                $statusCode = Get-GitHubApiStatusCode $_
                $canRecoverCreatedRelease = $RecoveryUri -and (
                  $statusCode -eq 422 -or $retryableStatusCodes -contains $statusCode
                )
                if ($canRecoverCreatedRelease) {
                  try {
                    return Invoke-RestMethod -Method Get -Uri $RecoveryUri -Headers $Headers -TimeoutSec $TimeoutSec -ErrorAction Stop
                  } catch {
                    $recoveryStatusCode = Get-GitHubApiStatusCode $_
                    if ($recoveryStatusCode -ne 404 -and $retryableStatusCodes -notcontains $recoveryStatusCode) {
                      throw
                    }
                  }
                }

                $isRetryable = $retryableStatusCodes -contains $statusCode -or (
                  $RecoveryUri -and $statusCode -eq 422
                )
                if (-not $isRetryable -or $attempt -eq $maximumAttempts) {
                  throw
                }
                $delaySeconds = [int][Math]::Min(30, 5 * [Math]::Pow(2, $attempt - 1))
                Write-Warning "GitHub API returned HTTP $statusCode for $Method $Uri (attempt $attempt/$maximumAttempts); retrying in $delaySeconds seconds."
                Start-Sleep -Seconds $delaySeconds
              }
            }
          }
          $owner = "${{ github.repository_owner }}"
          $repo = "${{ github.event.repository.name }}"
          $encodedTag = [uri]::EscapeDataString($env:RELEASE_TAG)
          $releaseByTagUri = "https://api.github.com/repos/$owner/$repo/releases/tags/$encodedTag"
          $releaseNotes = Get-Content -Raw -LiteralPath $env:RELEASE_NOTES_PATH
          $policyUrl = "https://github.com/$owner/$repo/blob/$env:RELEASE_TARGET/CODE_SIGNING_POLICY.md"
          if ($releaseNotes -notmatch '(?im)\[Code signing policy\]\(') {
            $releaseNotes = "$($releaseNotes.TrimEnd())`n`n---`n`n[Code signing policy]($policyUrl)`n"
          }
          $releaseBody = @{
            tag_name = $env:RELEASE_TAG
            target_commitish = $env:RELEASE_TARGET
            name = $env:RELEASE_TAG
            draft = $false
            prerelease = $false
            body = $releaseNotes
          } | ConvertTo-Json
          $releaseUpdateBody = @{
            tag_name = $env:RELEASE_TAG
            target_commitish = $env:RELEASE_TARGET
            name = $env:RELEASE_TAG
            draft = $false
            prerelease = $false
            body = $releaseNotes
          } | ConvertTo-Json

          try {
            $release = Invoke-GitHubApiWithRetry -Uri $releaseByTagUri -Headers $headers
          } catch {
            $statusCode = Get-GitHubApiStatusCode $_
            if ($statusCode -ne 404) {
              throw
            }
            $release = Invoke-GitHubApiWithRetry -Method Post -Uri "https://api.github.com/repos/$owner/$repo/releases" -Headers $headers -Body $releaseBody -ContentType "application/json" -RecoveryUri $releaseByTagUri
          }

          $files = @(Get-ChildItem -Path "release-artifact" -Filter "* Setup *.exe")
          if ($files.Count -ne 1) {
            throw "Expected exactly one Windows installer matching dist/* Setup *.exe, found $($files.Count)."
          }

          $release = Invoke-GitHubApiWithRetry -Method Patch -Uri "https://api.github.com/repos/$owner/$repo/releases/$($release.id)" -Headers $headers -Body $releaseUpdateBody -ContentType "application/json"
          $replaceAssetNames = @(
            "CarrotMangaTranslator-Setup-$env:RELEASE_TAG.exe",
            "SHA256SUMS-windows.txt",
            "windows-provenance.json"
          )
          foreach ($asset in $release.assets) {
            if ($replaceAssetNames -contains $asset.name) {
              Invoke-GitHubApiWithRetry -Method Delete -Uri "https://api.github.com/repos/$owner/$repo/releases/assets/$($asset.id)" -Headers $headers
              Write-Host "Deleted existing asset $($asset.name)"
            }
          }

          $uploadUrl = $release.upload_url -replace "\{\?name,label\}", ""
          foreach ($file in $files) {
            $assetName = "CarrotMangaTranslator-Setup-$env:RELEASE_TAG.exe"
            $encodedName = [uri]::EscapeDataString($assetName)
            $assetUploadUri = "$($uploadUrl)?name=$encodedName"
            Invoke-RestMethod `
              -Method Post `
              -Uri $assetUploadUri `
              -Headers $headers `
              -ContentType "application/octet-stream" `
              -InFile $file.FullName `
              -TimeoutSec 3600
            Write-Host "Uploaded $assetName from $($file.Name)"
          }
          foreach ($supportFile in @("SHA256SUMS-windows.txt", "windows-provenance.json")) {
            $supportPath = Join-Path "release-artifact" $supportFile
            $encodedName = [uri]::EscapeDataString($supportFile)
            Invoke-RestMethod -Method Post -Uri "$($uploadUrl)?name=$encodedName" -Headers $headers -ContentType "application/octet-stream" -InFile $supportPath -TimeoutSec 3600
          }
