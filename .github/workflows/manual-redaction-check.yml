name: Manual redaction workspace checks

# Development branch only; no release. checkpoint: repair-dev-locales-4
on:
  push:
    branches: [feat/manual-redaction-workspace-20260910]
    paths: [.github/workflows/manual-redaction-check.yml]

permissions:
  contents: write

env:
  PYTHONIOENCODING: utf-8
  PYTHONUTF8: "1"

concurrency:
  group: manual-redaction-workspace-validation
  cancel-in-progress: false

jobs:
  validate:
    if: github.repository == 'ucx0204/CarrotMangaTranslator'
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Check out the exact feature checkpoint
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
          show-progress: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies with bounded diagnostics
        shell: python
        run: |
          import subprocess
          result = subprocess.run(["npm.cmd", "ci"], capture_output=True, text=True, encoding="utf-8", errors="replace", timeout=900)
          print((result.stdout + result.stderr)[-5000:])
          raise SystemExit(result.returncode)
      - name: Apply the reviewed all-locale repair
        run: python .github/manual-redaction-integrate.py
      - name: Format feature changes and checkpoint integration
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          import os
          import subprocess
          branch = "feat/manual-redaction-workspace-20260910"
          assert os.environ["GITHUB_REF"] == "refs/heads/" + branch
          def run(args):
              result = subprocess.run(args, capture_output=True, text=True, encoding="utf-8", errors="replace", timeout=240)
              if result.returncode:
                  print((result.stdout + result.stderr)[-8000:])
                  raise SystemExit(result.returncode)
              return result.stdout.strip()
          files = run(["git", "diff", "--name-only", "--diff-filter=AM", "19b660f4160e4a64ce479caa09a20437f9ed3c81"]).splitlines()
          files = [path for path in files if path.endswith((".ts", ".tsx", ".json", ".css", ".md", ".yml"))]
          if files:
              print(run(["node", "node_modules/prettier/bin/prettier.cjs", "--write", *files])[-4000:])
          if run(["git", "diff", "--name-only"]):
              run(["git", "config", "user.name", "github-actions[bot]"])
              run(["git", "config", "user.email", "41898282+github-actions[bot]@users.noreply.github.com"])
              run(["git", "add", "--", *files])
              run(["git", "commit", "-m", "fix: checkpoint complete redaction locales and concise copy"])
              run(["gh", "auth", "setup-git"])
              run(["git", "push", "origin", "HEAD:refs/heads/" + branch])
          print("VALIDATED_SOURCE_SHA=" + run(["git", "rev-parse", "HEAD"]))
      - name: Validate development compilation, regressions, policies and build
        run: python .github/manual-redaction-validate.py
      - name: Record resumable validation status without copying raw logs
        if: always()
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          import json
          import os
          import subprocess
          from pathlib import Path
          branch = "feat/manual-redaction-workspace-20260910"
          assert os.environ["GITHUB_REF"] == "refs/heads/" + branch
          def run(args):
              return subprocess.run(args, check=True, capture_output=True, text=True, encoding="utf-8", errors="replace", timeout=120).stdout.strip()
          result = Path(".tmp/manual-redaction-check/result.json")
          if not result.exists():
              print("Validation did not finish. No success record created.")
              raise SystemExit(0)
          report = json.loads(result.read_text(encoding="utf-8"))
          remote = run(["gh", "api", "repos/ucx0204/CarrotMangaTranslator/git/ref/heads/" + branch, "--jq", ".object.sha"])
          if remote != run(["git", "rev-parse", "HEAD"]):
              print("Branch advanced; results remain in the Actions log. No newer work overwritten.")
              raise SystemExit(0)
          lines = ["# 최신 수동 가리기 검증 체크포인트", "", f"검사한 소스: `{report['source']}`", f"Actions 실행: `{report['run_id']}`", "", "전체 Check / 실제 UI QA와 별도의 집중 검증입니다.", ""]
          lines += [f"- {check['name']}: {'PASS' if check['exit_code'] == 0 else 'FAIL'} (exit {check['exit_code']})" for check in report["checks"]]
          lines += ["", "세부 실패는 해당 Actions 로그에서 확인합니다. 원시 로그·인증 정보는 복사하지 않습니다.", ""]
          path = Path("docs/manual-redaction-latest-validation.md")
          path.write_text("\n".join(lines), encoding="utf-8")
          run(["git", "config", "user.name", "github-actions[bot]"])
          run(["git", "config", "user.email", "41898282+github-actions[bot]@users.noreply.github.com"])
          run(["git", "add", str(path)])
          run(["git", "commit", "-m", "docs: record manual workspace validation checkpoint"])
          run(["gh", "auth", "setup-git"])
          run(["git", "push", "origin", "HEAD:refs/heads/" + branch])
