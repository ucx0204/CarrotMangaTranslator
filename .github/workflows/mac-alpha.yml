name: Apple Silicon Alpha

on:
  workflow_dispatch:
    inputs:
      alpha_number:
        description: "Alpha sequence number (example: 1)"
        required: true
        default: "1"
        type: string
      publish_release:
        description: "Publish/update the GitHub pre-release after verification"
        required: true
        default: true
        type: boolean
permissions:
  contents: read

concurrency:
  group: mac-alpha-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build_verify:
    runs-on: macos-15
    timeout-minutes: 360
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.release_meta.outputs.tag }}
      title: ${{ steps.release_meta.outputs.title }}
    env:
      MGT_MAC_CLEAN_CARGO_TARGET: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Confirm Apple Silicon runner
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "arm64"
          sw_vers
          sysctl -n hw.memsize

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Restore check acceleration cache
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: .tmp/check-cache
          key: check-${{ runner.os }}-node24-v1-${{ hashFiles('package-lock.json', 'scripts/run-prettier.cjs', 'scripts/dev-build-cache.cjs', 'scripts/build.cjs') }}-${{ github.sha }}
          restore-keys: |
            check-${{ runner.os }}-node24-v1-${{ hashFiles('package-lock.json', 'scripts/run-prettier.cjs', 'scripts/dev-build-cache.cjs', 'scripts/build.cjs') }}-

      - name: Run cross-platform checks
        run: npm run check

      - name: Capture production renderer at Alpha QA sizes
        run: |
          npm run qa:ui -- --entry index.html --width 1440 --height 900 --output "${RUNNER_TEMP}/mac-alpha-ui-1440x900.png"
          npm run qa:ui -- --entry index.html --width 1240 --height 760 --output "${RUNNER_TEMP}/mac-alpha-ui-1240x760.png"

      - name: Verify pinned model metadata
        run: npm run verify:hf-assets

      - name: Prepare unsigned macOS build inputs
        env:
          MGT_RELEASE_CHANNEL: mac-alpha
          MANGA_TRANSLATOR_BUILD_CHANNEL: mac-alpha
          MGT_TARGET_PLATFORM: darwin
          MGT_MAC_RUNTIME_ROOT: ${{ github.workspace }}/.tmp/mac-runtime
        run: |
          node scripts/prepare-mac-icon.cjs
          npm run build:mac:runners
          npm run prepare:mac:runtime
          npm run build

      - name: Select signing mode
        shell: bash
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY_P8_B64: ${{ secrets.APPLE_API_KEY_P8_B64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          values=("$CSC_LINK" "$CSC_KEY_PASSWORD" "$APPLE_API_KEY_P8_B64" "$APPLE_API_KEY_ID" "$APPLE_API_ISSUER")
          present=0
          for value in "${values[@]}"; do
            if [[ -n "$value" ]]; then present=$((present + 1)); fi
          done
          if [[ "$present" -eq 0 ]]; then
            echo "MGT_MAC_SIGNING_MODE=adhoc" >> "$GITHUB_ENV"
            echo "SIGNING_LABEL=Unsigned (ad-hoc)" >> "$GITHUB_ENV"
          elif [[ "$present" -ne 5 ]]; then
            echo "Developer ID signing secrets are only partially configured." >&2
            exit 1
          else
            key_path="$RUNNER_TEMP/AuthKey.p8"
            printf '%s' "$APPLE_API_KEY_P8_B64" | /usr/bin/base64 -D > "$key_path"
            chmod 600 "$key_path"
            echo "MGT_MAC_SIGNING_MODE=developer-id" >> "$GITHUB_ENV"
            echo "SIGNING_LABEL=Developer ID + notarized" >> "$GITHUB_ENV"
          fi

      - name: Build and verify arm64 DMG and ZIP
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ runner.temp }}/AuthKey.p8
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          MGT_MAC_BUILD_INPUTS_PREPARED: "1"
          MGT_MAC_ALPHA_ALLOW_HOSTED_APP_SMOKE_TRAP: macos15-electron43-crbrowsermain-v1
          MGT_MAC_ALPHA_RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: npm run dist:mac:alpha

      - name: Remove notarization key
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"

      - name: Confirm release artifacts
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          dmg_files=(dist/*-macOS-arm64-alpha.dmg)
          zip_files=(dist/*-macOS-arm64-alpha.zip)
          [[ "${#dmg_files[@]}" -eq 1 ]] || { echo "Expected exactly one Alpha DMG, found ${#dmg_files[@]}" >&2; exit 1; }
          [[ "${#zip_files[@]}" -eq 1 ]] || { echo "Expected exactly one Alpha ZIP, found ${#zip_files[@]}" >&2; exit 1; }
          test -s dist/SHA256SUMS-mac-alpha.txt

      - name: Resolve Alpha release metadata
        id: release_meta
        shell: bash
        env:
          INPUT_ALPHA_NUMBER: ${{ inputs.alpha_number }}
        run: |
          set -euo pipefail
          expected_ref="refs/heads/${{ github.event.repository.default_branch }}"
          if [[ "$GITHUB_REF" != "$expected_ref" ]]; then
            echo "Mac Alpha release must run from $expected_ref, not $GITHUB_REF." >&2
            exit 1
          fi
          if [[ ! "$INPUT_ALPHA_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            echo "alpha_number must be a positive integer." >&2
            exit 1
          fi
          version="$(node -p "require('./package.json').version")"
          tag="v${version}-mac-alpha.${INPUT_ALPHA_NUMBER}"
          if [[ "$MGT_MAC_SIGNING_MODE" = "developer-id" ]]; then
            title="Apple Silicon Alpha ${tag}"
          else
            title="Unsigned Apple Silicon Alpha ${tag}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "title=$title" >> "$GITHUB_OUTPUT"

      - name: Generate release notes
        shell: bash
        env:
          MGT_MAC_ALPHA_TAG: ${{ steps.release_meta.outputs.tag }}
          MGT_MAC_RELEASE_NOTES_PATH: dist/mac-alpha-release-notes.md
        run: node scripts/generate-mac-alpha-release-notes.cjs

      - name: Stage Alpha support files
        shell: bash
        run: cp docs/MAC_ALPHA_TEST_CHECKLIST.md dist/MAC_ALPHA_TEST_CHECKLIST.md

      - name: Generate Alpha provenance
        shell: bash
        run: |
          set -euo pipefail
          dmg="$(find dist -maxdepth 1 -name '*-macOS-arm64-alpha.dmg' -print -quit)"
          zip="$(find dist -maxdepth 1 -name '*-macOS-arm64-alpha.zip' -print -quit)"
          dmg_sha="$(shasum -a 256 "$dmg" | awk '{print $1}')"
          zip_sha="$(shasum -a 256 "$zip" | awk '{print $1}')"
          node -e 'const fs=require("fs"); fs.writeFileSync("dist/mac-alpha-provenance.json", JSON.stringify({schemaVersion:1,repository:process.env.GITHUB_REPOSITORY,commit:process.env.GITHUB_SHA,ref:process.env.GITHUB_REF,runId:process.env.GITHUB_RUN_ID,runAttempt:process.env.GITHUB_RUN_ATTEMPT,artifacts:{dmg:process.argv[1],zip:process.argv[2]}},null,2)+"\n")' "$dmg_sha" "$zip_sha"

      - name: Upload Alpha build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.release_meta.outputs.tag }}
          if-no-files-found: error
          retention-days: 30
          path: |
            dist/*-macOS-arm64-alpha.dmg
            dist/*-macOS-arm64-alpha.zip
            dist/SHA256SUMS-mac-alpha.txt
            dist/mac-alpha-hosted-app-smoke-waiver.json
            dist/mac-alpha-provenance.json
            dist/MAC_ALPHA_TEST_CHECKLIST.md
            dist/mac-alpha-release-notes.md
            ${{ runner.temp }}/mac-alpha-ui-1440x900.png
            ${{ runner.temp }}/mac-alpha-ui-1240x760.png

      - name: Summarize Alpha build
        shell: bash
        run: |
          {
            echo "### ${{ steps.release_meta.outputs.title }}"
            echo "- Runner: $(uname -m), $(sw_vers -productVersion)"
            echo "- Signing: $SIGNING_LABEL"
            if [[ -f dist/mac-alpha-hosted-app-smoke-waiver.json ]]; then
              echo "- Packaged GUI lifecycle: WAIVED on GitHub-hosted runner; real-Mac verification requested"
            else
              echo "- Packaged GUI lifecycle: passed"
            fi
            echo "- Gemma memory tiers remain unverified until tester checklists are received."
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    needs: build_verify
    if: ${{ inputs.publish_release && needs.build_verify.result == 'success' }}
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - name: Download verified Alpha artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ needs.build_verify.outputs.tag }}
          path: release-artifact

      - name: Verify and publish GitHub pre-release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.build_verify.outputs.tag }}
          RELEASE_TITLE: ${{ needs.build_verify.outputs.title }}
        run: |
          set -euo pipefail
          (cd release-artifact && shasum -a 256 -c SHA256SUMS-mac-alpha.txt)
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --title "$RELEASE_TITLE" --notes-file release-artifact/mac-alpha-release-notes.md --prerelease
          else
            gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --title "$RELEASE_TITLE" --notes-file release-artifact/mac-alpha-release-notes.md --prerelease
          fi
          gh release upload "$RELEASE_TAG" \
            release-artifact/*-macOS-arm64-alpha.dmg \
            release-artifact/*-macOS-arm64-alpha.zip \
            release-artifact/SHA256SUMS-mac-alpha.txt \
            release-artifact/mac-alpha-provenance.json \
            release-artifact/MAC_ALPHA_TEST_CHECKLIST.md \
            --clobber
