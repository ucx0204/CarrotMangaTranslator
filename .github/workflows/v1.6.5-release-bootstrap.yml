name: v1.6.5 Release Bootstrap

on:
  push:
    branches:
      - agent/v1.6.5-word-wrapping
    paths:
      - .github/workflows/v1.6.5-release-bootstrap.yml

permissions:
  actions: write
  contents: read
  pull-requests: read

concurrency:
  group: v1.6.5-release-bootstrap
  cancel-in-progress: false

jobs:
  dispatch-stable-release:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: "45"
      RELEASE_TAG: v1.6.5
    steps:
      - name: Wait for merge and publish both platforms
        shell: bash
        run: |
          set -euo pipefail

          find_run_id() {
            local workflow="$1"
            local dispatched_at="$2"
            local run_id=""
            for _ in $(seq 1 60); do
              run_id="$(
                gh api --method GET                   "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs"                   -f event=workflow_dispatch                   -f branch=master                   -f per_page=20                   --jq "[.workflow_runs[] | select(.created_at >= \"$dispatched_at\")] | sort_by(.created_at) | last | .id // empty"
              )"
              if [[ -n "$run_id" ]]; then
                printf '%s\n' "$run_id"
                return 0
              fi
              sleep 5
            done
            echo "Timed out locating $workflow run." >&2
            return 1
          }

          for _ in $(seq 1 180); do
            if [[ "$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '.merged')" == "true" ]]; then
              break
            fi
            sleep 10
          done

          if [[ "$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '.merged')" != "true" ]]; then
            echo "Pull request #$PR_NUMBER was not merged before timeout." >&2
            exit 1
          fi

          release_dispatched_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          gh workflow run release.yml             --repo "$GITHUB_REPOSITORY"             --ref master             -f "tag_name=$RELEASE_TAG"
          release_run_id="$(find_run_id release.yml "$release_dispatched_at")"
          gh run watch "$release_run_id"             --repo "$GITHUB_REPOSITORY"             --exit-status

          windows_asset="CarrotMangaTranslator-Setup-$RELEASE_TAG.exe"
          release_assets="$(
            gh release view "$RELEASE_TAG"               --repo "$GITHUB_REPOSITORY"               --json isDraft,isPrerelease,assets               --jq '.assets[].name'
          )"
          grep -Fxq "$windows_asset" <<<"$release_assets"

          mac_dispatched_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          gh workflow run mac-release.yml             --repo "$GITHUB_REPOSITORY"             --ref master             -f "tag_name=$RELEASE_TAG"
          mac_run_id="$(find_run_id mac-release.yml "$mac_dispatched_at")"
          gh run watch "$mac_run_id"             --repo "$GITHUB_REPOSITORY"             --exit-status

          for asset in             "$windows_asset"             "CarrotMangaTranslator-1.6.5-macOS-arm64.dmg"             "CarrotMangaTranslator-1.6.5-macOS-arm64.zip"             "SHA256SUMS-macOS-arm64.txt"; do
            gh release view "$RELEASE_TAG"               --repo "$GITHUB_REPOSITORY"               --json assets               --jq '.assets[].name' |
              grep -Fxq "$asset"
          done
