name: Manual redaction read-only audit

# Development branch only. Never merges, rewrites a branch or publishes a release.
on:
  push:
    branches: [feat/manual-redaction-workspace-20260910]
    paths: [.github/workflows/manual-redaction-audit.yml]

permissions:
  contents: read

env:
  PYTHONIOENCODING: utf-8
  PYTHONUTF8: "1"

jobs:
  audit:
    if: github.repository == 'ucx0204/CarrotMangaTranslator'
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Check out the exact feature checkpoint
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
          show-progress: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        shell: python
        run: |
          import subprocess
          result = subprocess.run(["npm.cmd", "ci"], capture_output=True, text=True, encoding="utf-8", errors="replace", timeout=900)
          print((result.stdout + result.stderr)[-4000:])
          raise SystemExit(result.returncode)
      - name: Check development compilation, tests, lint and build
        run: python .github/manual-redaction-validate.py
      - name: Capture actual UI and prepare a credential-free audit snapshot
        if: always()
        run: python .github/manual-redaction-audit.py
      - name: Preserve development diagnostics and screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: manual-redaction-audit-${{ github.run_id }}
          path: .tmp/manual-redaction-audit/
          if-no-files-found: error
          retention-days: 2
          compression-level: 0
