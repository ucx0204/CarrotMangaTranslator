name: Check

on:
  push:
    branches:
      - master
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows-check:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: npm ci

      - name: Restore check acceleration cache
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: .tmp/check-cache
          key: check-${{ runner.os }}-node22-v1-${{ hashFiles('package-lock.json', 'scripts/run-prettier.cjs', 'scripts/dev-build-cache.cjs', 'scripts/build.cjs') }}-${{ github.sha }}
          restore-keys: |
            check-${{ runner.os }}-node22-v1-${{ hashFiles('package-lock.json', 'scripts/run-prettier.cjs', 'scripts/dev-build-cache.cjs', 'scripts/build.cjs') }}-

      - name: Run checks
        run: npm run check

      - name: Preserve check diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: check-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .tmp/check-timings.json
            .tmp/check-logs/
            .tmp/check-results/
            coverage/coverage-summary.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

  macos-arm64-check:
    runs-on: macos-15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Confirm Apple Silicon runner
        shell: bash
        run: test "$(uname -m)" = "arm64"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Restore check acceleration cache
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: .tmp/check-cache
          key: check-${{ runner.os }}-node24-v1-${{ hashFiles('package-lock.json', 'scripts/run-prettier.cjs', 'scripts/dev-build-cache.cjs', 'scripts/build.cjs') }}-${{ github.sha }}
          restore-keys: |
            check-${{ runner.os }}-node24-v1-${{ hashFiles('package-lock.json', 'scripts/run-prettier.cjs', 'scripts/dev-build-cache.cjs', 'scripts/build.cjs') }}-

      - name: Run checks
        run: npm run check

      - name: Test Flux Metal runtime
        run: npm run test:flux-metal

      - name: Set up font runtime smoke Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Verify published font runtime on Apple Silicon
        run: |
          python -m pip install torch==2.9.1 pillow==11.3.0
          node node_modules/electron/cli.js scripts/smoke-font-chapter-runtime.cjs out .tmp/font-chapter-native-smoke out/app-runtime python tests/fixtures/font-chapter-native-reference.json

      - name: Preserve check diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: check-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .tmp/check-timings.json
            .tmp/check-logs/
            .tmp/check-results/
            coverage/coverage-summary.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
