name: Check
on:
  push:
    branches:
      - master
      - main
  pull_request: null
permissions:
  contents: read
concurrency:
  group: check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  windows-build:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Set up check toolchain
        uses: ./.github/actions/check-setup
        with:
          phase: build
      - name: Run static, build and Electron checks
        run: npm run check -- --phase=build
      - name: Validate published Windows CUDA, AMD and Vulkan command lines
        timeout-minutes: 30
        run: node scripts/verify-llama-runtime-cli.cjs
      - name: Preserve check diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: check-build-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .tmp/check-timings.json
            .tmp/check-logs/
            .tmp/check-results/
            coverage/coverage-summary.json
            .tmp/llama-runtime-cli/report.json
            .tmp/llama-runtime-cli/*-help.log
            .tmp/llama-runtime-cli/probe-*.log
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
  windows-tests:
    runs-on: windows-latest
    env:
      # Real persistence/recovery tests contend for disk with four local workers.
      MGT_VITEST_MAX_WORKERS: "2"
    strategy:
      fail-fast: false
      matrix:
        shard:
          - 1
          - 2
          - 3
          - 4
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - name: Set up check toolchain
        uses: ./.github/actions/check-setup
        with:
          phase: test
      - name: Run test shard
        run: npm run check -- --phase=test --shard=${{ matrix.shard }}/4
      - name: Upload successful test shard
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-shard-${{ runner.os }}-${{ matrix.shard }}
          path: .tmp/check-shards/
          overwrite: true
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 2
      - name: Preserve check diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: check-test-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.shard }}
          path: |
            .tmp/check-timings.json
            .tmp/check-logs/
            .tmp/check-results/
            coverage/coverage-summary.json
            .tmp/llama-runtime-cli/report.json
            .tmp/llama-runtime-cli/*-help.log
            .tmp/llama-runtime-cli/probe-*.log
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
  windows-check:
    runs-on: windows-latest
    needs:
      - windows-build
      - windows-tests
    if: always()
    steps:
      - name: Require every build and test shard to pass
        shell: bash
        env:
          BUILD_RESULT: ${{ needs.windows-build.result }}
          TEST_RESULT: ${{ needs.windows-tests.result }}
        run: test "$BUILD_RESULT" = success && test "$TEST_RESULT" = success
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - name: Set up check toolchain
        uses: ./.github/actions/check-setup
        with:
          phase: merge
      - name: Download all four test shards
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: test-shard-${{ runner.os }}-*
          path: .tmp/check-shards
          merge-multiple: true
      - name: Merge full test coverage and enforce existing gates
        run: npm run check -- --phase=merge
      - name: Preserve check diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: check-merge-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .tmp/check-timings.json
            .tmp/check-logs/
            .tmp/check-results/
            coverage/coverage-summary.json
            .tmp/llama-runtime-cli/report.json
            .tmp/llama-runtime-cli/*-help.log
            .tmp/llama-runtime-cli/probe-*.log
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
  macos-arm64-build:
    runs-on: macos-26
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      MGT_VITEST_MAX_WORKERS: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Confirm Apple Silicon runner
        shell: bash
        run: test "$(uname -m)" = "arm64"
      - name: Set up check toolchain
        uses: ./.github/actions/check-setup
        with:
          phase: build
      - name: Run static, build and Electron checks
        run: npm run check -- --phase=build
      - name: Validate published Apple Silicon command lines and native loader
        timeout-minutes: 15
        run: node scripts/verify-llama-runtime-cli.cjs
      - name: Test Flux Metal runtime
        run: npm run test:flux-metal
      - name: Set up font runtime smoke Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Verify published font runtime on Apple Silicon
        run: |
          python -m pip install torch==2.9.1 pillow==11.3.0
          node node_modules/electron/cli.js scripts/smoke-font-chapter-runtime.cjs out .tmp/font-chapter-native-smoke out/app-runtime python tests/fixtures/font-chapter-native-reference.json
      - name: Preserve check diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: check-build-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .tmp/check-timings.json
            .tmp/check-logs/
            .tmp/check-results/
            coverage/coverage-summary.json
            .tmp/llama-runtime-cli/report.json
            .tmp/llama-runtime-cli/*-help.log
            .tmp/llama-runtime-cli/probe-*.log
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
  macos-arm64-tests:
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        shard:
          - 1
          - 2
          - 3
          - 4
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      MGT_VITEST_MAX_WORKERS: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - name: Confirm Apple Silicon runner
        shell: bash
        run: test "$(uname -m)" = "arm64"
      - name: Set up check toolchain
        uses: ./.github/actions/check-setup
        with:
          phase: test
      - name: Run test shard
        run: npm run check -- --phase=test --shard=${{ matrix.shard }}/4
      - name: Upload successful test shard
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-shard-${{ runner.os }}-${{ matrix.shard }}
          path: .tmp/check-shards/
          overwrite: true
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 2
      - name: Preserve check diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: check-test-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.shard }}
          path: |
            .tmp/check-timings.json
            .tmp/check-logs/
            .tmp/check-results/
            coverage/coverage-summary.json
            .tmp/llama-runtime-cli/report.json
            .tmp/llama-runtime-cli/*-help.log
            .tmp/llama-runtime-cli/probe-*.log
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
  macos-arm64-check:
    runs-on: macos-26
    needs:
      - macos-arm64-build
      - macos-arm64-tests
    if: always()
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      MGT_VITEST_MAX_WORKERS: "1"
    steps:
      - name: Require every build and test shard to pass
        shell: bash
        env:
          BUILD_RESULT: ${{ needs.macos-arm64-build.result }}
          TEST_RESULT: ${{ needs.macos-arm64-tests.result }}
        run: test "$BUILD_RESULT" = success && test "$TEST_RESULT" = success
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - name: Confirm Apple Silicon runner
        shell: bash
        run: test "$(uname -m)" = "arm64"
      - name: Set up check toolchain
        uses: ./.github/actions/check-setup
        with:
          phase: merge
      - name: Download all four test shards
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: test-shard-${{ runner.os }}-*
          path: .tmp/check-shards
          merge-multiple: true
      - name: Merge full test coverage and enforce existing gates
        run: npm run check -- --phase=merge
      - name: Preserve check diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: check-merge-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .tmp/check-timings.json
            .tmp/check-logs/
            .tmp/check-results/
            coverage/coverage-summary.json
            .tmp/llama-runtime-cli/report.json
            .tmp/llama-runtime-cli/*-help.log
            .tmp/llama-runtime-cli/probe-*.log
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
