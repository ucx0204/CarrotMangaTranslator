name: MCP offline development kit

on:
  push:
    branches: [feat/mcp-app-bridge]
    paths: [.github/workflows/mcp-offline-kit.yml]

permissions:
  contents: read

jobs:
  source-review:
    if: github.repository == 'ucx0204/CarrotMangaTranslator' && github.ref == 'refs/heads/feat/mcp-app-bridge'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Snapshot incremental source for conflict-aware publication
        shell: bash
        run: |
          set -euo pipefail
          base=0ef7c4edd3767748579db23f25c0476a7a7d227c
          git merge-base --is-ancestor "$base" HEAD
          git diff --binary "$base" HEAD > "$RUNNER_TEMP/mcp-remote-changes.patch"
          git ls-tree -r HEAD > "$RUNNER_TEMP/mcp-remote-tree.txt"
          git log -1 --format='%H%n%T%n%P%n%s' > "$RUNNER_TEMP/mcp-remote-head.txt"
          git bundle create "$RUNNER_TEMP/mcp-remote-incremental.bundle" "$base"..HEAD
          sha256sum "$RUNNER_TEMP"/mcp-remote-* > "$RUNNER_TEMP/mcp-remote-sha256.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mcp-publication-review
          path: ${{ runner.temp }}/mcp-remote-*
          retention-days: 1
          compression-level: 6
