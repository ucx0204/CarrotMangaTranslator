name: Windows UAC Check

on:
  push:
    branches:
      - fix/windows-protected-folder-uac
  pull_request:
    paths:
      - .github/workflows/windows-uac-check.yml
      - build/installer.nsh
      - build/windows*.nsh
      - src/main/startupWriteAccess.ts
      - src/main/windowsElevation.ts
      - src/main/windowsStartup.ts
      - src/main/bootstrap.ts
      - scripts/build-windows-installer.cjs
      - scripts/smoke-windows-uac-installer.cjs
      - tests/*windows*Startup*.test.ts
      - tests/windowsElevation.test.ts
      - tests/startupWriteAccess.test.ts
      - tests/installerConfig.test.ts
      - tests/windowsInstallerPermissions.test.ts

permissions:
  contents: read

concurrency:
  group: windows-uac-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows-uac:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        id: dependencies
        run: npm ci
      - name: Test startup and installer boundaries
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: npx vitest run tests/startupWriteAccess.test.ts tests/windowsStartup.test.ts tests/windowsElevation.test.ts tests/installerConfig.test.ts
      - name: Check Electron types
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: npm run typecheck:electron
      - name: Check changed file lint
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: npx eslint src/main/startupWriteAccess.ts src/main/windowsElevation.ts src/main/windowsStartup.ts tests/startupWriteAccess.test.ts tests/windowsStartup.test.ts tests/windowsElevation.test.ts scripts/smoke-windows-uac-installer.cjs --max-warnings 0
      - name: Report exact formatting differences
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        shell: pwsh
        run: |
          npx prettier --write src/main/startupWriteAccess.ts src/main/windowsElevation.ts src/main/windowsStartup.ts tests/startupWriteAccess.test.ts tests/windowsStartup.test.ts tests/windowsElevation.test.ts scripts/smoke-windows-uac-installer.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --exit-code
      - name: Compile and smoke-test protected-folder installation
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: node scripts/smoke-windows-uac-installer.cjs
