name: Validate MCP implementation checkpoints

on:
  push:
    branches: [feat/mcp-app-bridge]
    paths: ["docs/mcp-checkpoints/*.patch", ".github/workflows/mcp-submit.yml"]

permissions:
  contents: read

concurrency:
  group: mcp-submit-feature-branch
  cancel-in-progress: false

jobs:
  validate:
    if: github.repository == 'ucx0204/CarrotMangaTranslator' && github.ref == 'refs/heads/feat/mcp-app-bridge'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate source patches against the checked-out commit
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          patches=(docs/mcp-checkpoints/*.patch)
          if [ ${#patches[@]} -eq 0 ]; then exit 0; fi
          for patch in "${patches[@]}"; do
            git apply --check --index --recount "$patch"
            git apply --index --recount "$patch"
            git rm -- "$patch"
          done
          if git diff --cached --name-only | grep -vE '^(src/(main|shared|preload|renderer)/|tests/mcp|scripts/mcp|docs/mcp|scripts/production-cleanup-coverage-floors\.json$)' ; then
            echo 'Unexpected checkpoint path'; exit 1
          fi
          git diff --cached --check
          git diff --cached --stat
