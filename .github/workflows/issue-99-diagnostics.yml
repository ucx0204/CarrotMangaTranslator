name: Issue 99 diagnostics

on:
  push:
    branches:
      - fix/issue-99-flux-gpu-binding

permissions:
  contents: read

jobs:
  formatting-diagnostics:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install JavaScript dependencies without native install scripts
        run: npm ci --ignore-scripts

      - name: Export formatter and expected document without editing source
        run: |
          mkdir -p .tmp/issue-99-diagnostics
          node node_modules/prettier/bin/prettier.cjs docs/issue-99-flux-gpu-binding-handoff.md > .tmp/issue-99-diagnostics/handoff.md
          tar -czf .tmp/issue-99-diagnostics/prettier.tgz -C node_modules prettier
          git rev-parse HEAD > .tmp/issue-99-diagnostics/source-commit.txt
          node -p 'JSON.stringify(require("./node_modules/prettier/package.json").version)' > .tmp/issue-99-diagnostics/prettier-version.txt

      - name: Inspect changed-source lint rules
        run: |
          node node_modules/eslint/bin/eslint.js src/main/gpuInfo.ts src/main/gpuInfoTypes.ts src/main/inpainting.ts src/main/inpainting/computeGpuEnv.ts src/main/inpainting/fluxCudaDevice.ts src/main/inpainting/fluxEngineLaunch.ts src/main/inpainting/fluxEnginePool.ts src/main/inpainting/fluxWorker.ts src/main/inpainting/fluxWorkerEnv.ts src/main/inpainting/fluxWorkerTypes.ts src/shared/gpuSettings.ts tests/computeGpuRuntimeRouting.test.ts tests/fluxCudaDevice.test.ts tests/fluxEngineLaunch.test.ts tests/nvidiaGpuSelection.test.ts > .tmp/issue-99-diagnostics/eslint.log 2>&1

      - name: Preserve diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: issue-99-formatting-${{ github.sha }}
          path: .tmp/issue-99-diagnostics/
          include-hidden-files: true
          retention-days: 1
